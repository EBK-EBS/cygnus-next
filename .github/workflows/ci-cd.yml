name: Cygnus Next frontend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cygnus-next-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        env:
          # The active server-side deploy injects the configured API URL at
          # image-build time. CI validates that the application compiles
          # without exposing deployment or provider secrets.
          VITE_CYGNUS_API_URL: https://api.invalid.example
        run: npm run build
