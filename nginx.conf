# Configuración Nginx para SPA con React Router
# - Fallback a index.html para rutas client-side (crítico en /estado-cuenta, etc.)
# - Gzip de estáticos
# - Cache inmutable para assets hasheados por Vite

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets hasheados por Vite (build/*.js|css) — cache largo e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imágenes del proyecto
    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Fallback SPA: cualquier ruta no encontrada sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}